<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Helper</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      color: #1f2937;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <h1>Vocab Helper ✨</h1>
  <p>Select any text on a webpage to look up its meaning, collocations, and examples using AI.</p>
  <button id="open-web-app" class="btn">Open Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
